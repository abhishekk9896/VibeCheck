[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-auditor"
version = "0.1.0"
description = "A Scope & Quality Auditor Agent for Python projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pytest-json-report>=1.5.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
scope-auditor = "auditor.cli.main:app"

[tool.setuptools.packages.find]
include = ["auditor*"]