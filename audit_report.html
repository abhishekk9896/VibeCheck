<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scope Auditor Report</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #1f2937; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f9fafb; }
    .header { background: #ffffff; padding: 24px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 24px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 9999px; color: #ffffff; font-weight: bold; font-size: 0.875rem; background-color: #10b981; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #ffffff; padding: 16px; border-radius: 8px; border: 1px solid #e5e7eb; text-align: center; }
    .card .val { font-size: 1.5rem; font-weight: bold; color: #111827; }
    .card .lbl { font-size: 0.875rem; color: #6b7280; }
    .section { background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 16px; }
    pre { background: #f3f4f6; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">PASSED</span>
    <h2>Scope Auditor Executive Report</h2>
    <p>Target Root: <code>.</code> | Spec: <code>SCOPE.md</code></p>
  </div>

  <div class="grid">
    <div class="card"><div class="val">1</div><div class="lbl">Requirements</div></div>
    <div class="card"><div class="val">15</div><div class="lbl">Files Mapped</div></div>
    <div class="card"><div class="val">0</div><div class="lbl">Lint Issues</div></div>
    <div class="card"><div class="val">3/3</div><div class="lbl">Pytest Pass Rate</div></div>
    <div class="card"><div class="val">0</div><div class="lbl">Missing Reqs</div></div>
  </div>

  <div class="section">
    <h3>Requirements Compliance</h3>
    <ul>
      <li><strong>User Authentication</strong></li>
    </ul>
  </div>

  <div class="section">
    <h3>Test Failures</h3>
    <p style='color: #10b981;'>✓ All tests passed!</p>
  </div>
</body>
</html>
